{% extends "base.html" %}

{% block title %}Add Sale{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 class="mb-1">Add Sale</h4>
                    <p class="text-muted mb-0">Create a new sales record in the database.</p>
                </div>
                <a href="{{ url_for('main.dashboard') }}" class="btn btn-outline-secondary btn-sm">Back to dashboard</a>
            </div>

            <form method="post" class="row g-3">
                <div class="col-md-6">
                    <label for="order_date" class="form-label">Order date</label>
                    <input type="date" class="form-control" id="order_date" name="order_date" value="{{ form_data.order_date }}" required>
                </div>
                <div class="col-md-6">
                    <label for="customer" class="form-label">Customer</label>
                    <input type="text" class="form-control" id="customer" name="customer" list="customer-options" value="{{ form_data.customer }}" required>
                    <datalist id="customer-options">
                        {% for customer in options.customers %}
                        <option value="{{ customer }}"></option>
                        {% endfor %}
                    </datalist>
                </div>
                <div class="col-md-6">
                    <label for="product" class="form-label">Product</label>
                    <input type="text" class="form-control" id="product" name="product" list="product-options" value="{{ form_data.product }}" required>
                    <datalist id="product-options">
                        {% for product in options.products %}
                        <option value="{{ product }}"></option>
                        {% endfor %}
                    </datalist>
                </div>
                <div class="col-md-6">
                    <label for="region" class="form-label">Region</label>
                    <select class="form-select" id="region" name="region" required>
                        <option value="">Select region</option>
                        {% for region in options.regions %}
                        <option value="{{ region }}" {% if form_data.region == region %}selected{% endif %}>{{ region }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="quantity" class="form-label">Quantity</label>
                    <input type="number" min="1" class="form-control" id="quantity" name="quantity" value="{{ form_data.quantity or 1 }}" required>
                </div>
                <div class="col-md-6">
                    <label for="unit_price" class="form-label">Unit price</label>
                    <input type="number" min="0.01" step="0.01" class="form-control" id="unit_price" name="unit_price" value="{{ form_data.unit_price }}" required>
                </div>
                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Save sale</button>
                    <a href="{{ url_for('main.import_csv') }}" class="btn btn-outline-primary">Import CSV instead</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
